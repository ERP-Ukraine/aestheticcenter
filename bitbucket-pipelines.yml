image: erpukraine/pipelines:default-image-2

pipelines:
  default:
    - step:
        name: Unit Tests
        script:
          - ./tests.sh
        services:
          - postgres
          - docker
  branches:
    master:
      - step:
          name: Build Production Image
          services:
            - docker
          script:
            - ./setup.sh
            - ./build.sh
      - step:
          name: Deploy to Production
          deployment: production
          trigger: manual
          services:
            - docker
          script:
            - ./deploy-erpu-saas.sh production
    staging:
      - step:
          name: Build Staging Image
          services:
            - docker
          script:
            - export WITH_TEST_DB="yes"
            - ./setup.sh
            - ./build.sh
      - step:
          name: Deploy to Staging
          deployment: staging
          trigger: manual
          services:
            - docker
          script:
            - ./deploy-erpu-saas.sh staging1
definitions:
  services:
    postgres:
      image: postgres:16.4
      environment:
        POSTGRES_PASSWORD: odoo
        POSTGRES_USER: odoo
